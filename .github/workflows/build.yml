name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - run: npx cap init "Word Hunt" "com.vaibhav.wordhunt" --web-dir=.
      - run: npx cap add android
      - run: npx cap sync
      - run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
        env:
          GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=600000 -Dorg.gradle.internal.http.socketTimeout=600000"
      - uses: actions/upload-artifact@v4
        with:
          name: wordhunt-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
